[project]
name = "mlsd-2026"
version = "0.1.0"
description = "An incident diagnosis agent for offline microservice telemetry"
readme = "README.md"
authors = [
    { name = "germankochnev", email = "kochgerm@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
mlsd-2026 = "mlsd_2026:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.3",
]
eda = [
    "huggingface-hub>=2.4.0",
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
]
